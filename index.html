    /* inject CSS vars immediately — no FOUC */

      const s = document.createElement('style');
      s.textContent = [
        ':root{',
        `  --cursor:${K.cursor};`,
        `  --bg-base:${K.pageBgBase};`,
        `  --bg-rad-c:${K.bgRadialCenter};`,
        `  --bg-rad-e:${K.bgRadialEdge};`,

        `  --card-rad:${K.cardRadialCenter};`,
        `  --card-ri-c:${K.cardRadialInnerColor || 'rgba(255,255,255,.07)'};`,
        `  --card-ri-e:${K.cardRadialInnerEdge || 'rgba(255,255,255,0)'};`,

        `  --s-offline:${K.statusOffline};`,
        `  --ff:'Inter',sans-serif;`,
        '}'
      ].join('\n');
      document.head.appendChild(s);
    })();

    /* start background video immediately — don't wait for DOMContentLoaded */
    (function () {
      if (CFG.BG.type !== 'video' || !CFG.BG.url) return;
      const v = document.createElement('video');
      v.setAttribute('autoplay', '');
      v.setAttribute('loop', '');
      v.setAttribute('muted', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('preload', 'auto');
      v.muted = true;

      v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
      /* store ref so the main init block can skip re-creating it */
      window._bgVideo = v;
      document.addEventListener('visibilitychange', function () { if (window._bgVideo) window._bgVideo.play().catch(function () { }); });
      v.play().catch(() => { });
      /* append as soon as bg div exists — use a tiny polling trick */
      function tryAppend() {
        const bg = document.getElementById('bg');
        if (bg) {
          bg.appendChild(v);
          const bgo = document.getElementById('bg-over');
          if (bgo) bgo.style.cssText = `display:block;background:rgba(0,0,0,${CFG.BG.overlay})`;
        } else {
          requestAnimationFrame(tryAppend);
        }
      }
      requestAnimationFrame(tryAppend);

  <script>
    let _wavePlaying = false;
    let _analyser = null, _dataArr = null;

    (function () {
      const C = CFG, K = C.COLOR;

      /* banner */
      if (C.BANNER && C.BANNER.url) {
        const bw = document.getElementById('banner-wrap');
        const bi = document.getElementById('banner-img');
        const bo = document.getElementById('banner-over');
        bw.style.display = 'block';
        bw.style.height = (C.BANNER.height || 90) + 'px';
        bi.src = C.BANNER.url;
        if (C.BANNER.overlay > 0)
          bo.style.background = `rgba(0,0,0,${C.BANNER.overlay})`;
      }

      /* background — skip if video already created by early-init block */
      const bgm = document.getElementById('bg-media');
      const bgo = document.getElementById('bg-over');
      if (!window._bgVideo) {
        if (C.BG.type === 'image' && C.BG.url) {
          bgm.src = C.BG.url; bgm.style.display = 'block';
          bgo.style.cssText = `display:block;background:rgba(0,0,0,${C.BG.overlay})`;
        } else if (C.BG.type === 'webcam') {
          const v = document.createElement('video');
          v.autoplay = true; v.muted = true; v.playsInline = true;
          v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)';
          document.getElementById('bg').appendChild(v);
          bgo.style.cssText = `display:block;background:rgba(0,0,0,${C.BG.overlay ?? 0.55})`;
          navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } })
            .then(stream => { v.srcObject = stream; })
            .catch(err => { console.warn(err); v.remove(); bgo.style.display = 'none'; });
        }
      }

      setName(C.NAME);
      // Try fetching avatar from Discord public API first, fall back to local image
      fetch(`https://api.lanyard.rest/v1/users/${C.DISCORD_ID}`)
        .then(r => r.ok ? r.json() : null)
        .then(j => {
          if (j && j.data && j.data.discord_user && j.data.discord_user.avatar) {
            const u = j.data.discord_user;
            setAvatar(`https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`);
            setName(u.global_name || u.username);
            const handleEl = document.getElementById('p-handle');
            handleEl.textContent = '@' + u.username;
            document.getElementById('av-dot').dataset.s = j.data.discord_status || 'offline';
          } else {
            if (C.AVATAR) setAvatar(C.AVATAR);
            else document.getElementById('av-el').textContent = C.NAME[0]?.toUpperCase() || '?';
          }
        })
        .catch(() => {
          if (C.AVATAR) setAvatar(C.AVATAR);
          else document.getElementById('av-el').textContent = C.NAME[0]?.toUpperCase() || '?';
        });
      document.getElementById('av-dot').dataset.s = 'offline';

      if (!C.DISCORD_ID || C.DISCORD_ID === 'YOUR_DISCORD_ID_HERE') {
        setName(C.NAME);
        if (C.AVATAR) setAvatar(C.AVATAR);
        else document.getElementById('av-el').textContent = C.NAME[0]?.toUpperCase() || '?';
      }

      if (C.ABOUT && C.ABOUT.trim()) {
        const ab = document.getElementById('about');
        if (ab) { ab.textContent = C.ABOUT; ab.style.display = 'block'; }
      }

      const foot = document.getElementById('foot-links');
      C.LINKS.forEach(l => {
        const a = document.createElement('a');
        a.className = 'foot-btn'; a.href = l.url; a.target = '_blank';
        const ico = l.img
          ? `<img class="foot-ico-img" src="${l.img}" alt="${l.label}"/>`
          : `<em class="foot-ico">${l.icon || ''}</em>`;
        a.innerHTML = `${ico}${l.label}`;
        foot.appendChild(a);
      });

      initCursor();
      initTilt();
      initWave();

      if (C.DISCORD_ID && C.DISCORD_ID !== 'YOUR_DISCORD_ID_HERE') startLanyard(C.DISCORD_ID, C.GF_DISCORD_ID);

      initPlayer(C.TRACKS);

      /* ── view counter (abacus.jasoncameron.dev) ── */
      (function () {
        const VIEWS_KEY = 'biscuit-views-v2';
        const NS = 'onyxv2.lol';
        const el = document.getElementById('views-num');

        fetch(`https://abacus.jasoncameron.dev/get/${NS}/${VIEWS_KEY}`)
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (d && d.value !== null && d.value !== undefined) {
              /* counter exists — hit it */
              return fetch(`https://abacus.jasoncameron.dev/hit/${NS}/${VIEWS_KEY}`).then(r => r.json());
            } else {
              /* create it seeded at 1284 */
              return fetch(`https://abacus.jasoncameron.dev/create?namespace=${NS}&key=${VIEWS_KEY}&value=1284`)
                .then(() => fetch(`https://abacus.jasoncameron.dev/hit/${NS}/${VIEWS_KEY}`))
                .then(r => r.json());
            }
          })
          .then(d => { el.textContent = Number(d.value ?? 0).toLocaleString(); })
          .catch(() => { el.textContent = '—'; });
      })();

      /* ── like counter — using countapi.xyz (no CORS issues, persistent) ── */
      const LIKE_NS = 'biscuit-bio';
      const LIKE_KEY = 'likes-v1';
      const likeBtn = document.getElementById('btn-like');
      const likeNum = document.getElementById('likes-num');

      function likeApiGet() {
        return fetch(`https://abacus.jasoncameron.dev/get/onyxv2.lol/biscuit-likes`)
          .then(r => r.json()).then(d => d.value ?? 0);
      }
      function likeApiHit() {
        return fetch(`https://abacus.jasoncameron.dev/hit/onyxv2.lol/biscuit-likes`)
          .then(r => r.json()).then(d => d.value ?? 0);
      }

      /* fetch current likes */
      likeApiGet()
        .then(v => { likeNum.textContent = Number(v).toLocaleString(); })
        .catch(() => { likeNum.textContent = '0'; });

      if (localStorage.getItem('biscuit_liked')) likeBtn.classList.add('liked');

      likeBtn.addEventListener('click', () => {
        if (localStorage.getItem('biscuit_liked')) return;
        localStorage.setItem('biscuit_liked', '1');
        likeBtn.classList.add('liked');
        /* optimistic update */
        let cur = parseInt(likeNum.textContent.replace(/,/g, '')) || 0;
        likeNum.textContent = (cur + 1).toLocaleString();
        /* persist to countapi */
        likeApiHit()
          .then(v => { likeNum.textContent = Number(v).toLocaleString(); })
          .catch(() => { });
      });

    })();

    /* ─────────────── CURSOR ─────────────── */
    function initCursor() {
      const cv = document.getElementById('cur-canvas');
      const ctx = cv.getContext('2d');

      function resize() { cv.width = innerWidth; cv.height = innerHeight; }
      resize(); addEventListener('resize', resize);

      let mx = innerWidth / 2, my = innerHeight / 2;
      let sx = mx, sy = my;
      let rafPending = false;

      document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

      function parseAccent() {
        const c = getComputedStyle(document.documentElement).getPropertyValue('--cursor').trim() || '#ffffff';
        if (c.startsWith('#')) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
        const m = c.match(/[0-9]+/g); return m ? [+m[0], +m[1], +m[2]] : [255, 255, 255];
      }

      let cachedRGB = parseAccent();
      /* re-parse accent only every ~60 frames — not every frame */
      let accentFrame = 0;

      function draw() {
        requestAnimationFrame(draw);
        ctx.clearRect(0, 0, cv.width, cv.height);
        sx += (mx - sx) * 0.18; sy += (my - sy) * 1;

        if (++accentFrame > 60) { accentFrame = 0; cachedRGB = parseAccent(); }
        const [r, g, b] = cachedRGB;

        const grd = ctx.createRadialGradient(sx, sy, 0, sx, sy, 22);
        grd.addColorStop(0, `rgba(${r},${g},${b},0.25)`);
        grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.beginPath(); ctx.arc(sx, sy, 22, 0, Math.PI * 2);
        ctx.fillStyle = grd; ctx.fill();

        ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},1)`;
        ctx.shadowColor = `rgba(${r},${g},${b},1)`;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      draw();
    }

    /* ─────────────── TILT ─────────────── */
    function initTilt() {
      const card = document.getElementById('card');
      const shine = document.getElementById('shine');
      const DEG = CFG.TILT_DEG;
      const SC = CFG.TILT_SCALE;

      card.addEventListener('animationend', () => {
        card.style.animation = 'none';
        card.style.opacity = '1';
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      }, { once: true });

      /* throttle tilt to rAF — avoids layout thrash on every mousemove */
      let tiltRaf = null;
      let pendingNx = 0, pendingNy = 0, pendingRX = 0, pendingRY = 0;

      card.addEventListener('mousemove', function (e) {
        const r = this.getBoundingClientRect();
        pendingNx = (e.clientX - r.left - r.width * .5) / (r.width * .5);
        pendingNy = (e.clientY - r.top - r.height * .5) / (r.height * .5);
        pendingRX = -pendingNy * DEG;
        pendingRY = pendingNx * DEG;
        if (!tiltRaf) tiltRaf = requestAnimationFrame(applyTilt);
      });

      function applyTilt() {
        tiltRaf = null;
        card.style.transition = 'box-shadow .2s';
        card.style.transform = `rotateX(${pendingRX}deg) rotateY(${pendingRY}deg) scale(${SC})`;
        shine.style.opacity = '1';
        shine.style.background = `radial-gradient(circle at ${(pendingNx * .5 + .5) * 100}% ${(pendingNy * .5 + .5) * 100}%, var(--card-shine), transparent 55%)`;
      }

      card.addEventListener('mouseleave', function () {
        tiltRaf && cancelAnimationFrame(tiltRaf); tiltRaf = null;
        this.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1), box-shadow .3s';
        this.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        shine.style.opacity = '0';
      });

      const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.matchMedia('(pointer:coarse)').matches;
      if (isMobile && window.DeviceOrientationEvent) {
        let baseBeta = null, baseGamma = null;

        const footLinks = document.getElementById('foot-links');
        const resetGyroBtn = document.createElement('button');
        resetGyroBtn.className = 'foot-btn';
        resetGyroBtn.style.cursor = 'pointer';
        resetGyroBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px; opacity:0.9;"><circle cx="12" cy="12" r="3"/><path d="M19 12h3"/><path d="M2 12h3"/><path d="M12 2v3"/><path d="M12 19v3"/></svg>Recenter`;
        resetGyroBtn.title = "Recalibrate Tilt Center";
        resetGyroBtn.onclick = () => {
          baseBeta = null; baseGamma = null;
          resetGyroBtn.style.transform = 'scale(0.9)';
          setTimeout(() => resetGyroBtn.style.transform = '', 150);
        };
        footLinks.appendChild(resetGyroBtn);

        let gyroRaf = null;
        let gRX = 0, gRY = 0, gNx = 0, gNy = 0;

        function applyGyro(e) {
          if (baseBeta === null) { baseBeta = e.beta || 0; baseGamma = e.gamma || 0; return; }
          const dGamma = Math.max(-30, Math.min(30, (e.gamma || 0) - baseGamma));
          const dBeta = Math.max(-30, Math.min(30, (e.beta || 0) - baseBeta));
          gRY = (dGamma / 30) * (DEG * 1.5);
          gRX = -(dBeta / 30) * (DEG * 1.5);
          gNx = dGamma / 30; gNy = dBeta / 30;
          if (!gyroRaf) gyroRaf = requestAnimationFrame(applyGyroFrame);
        }
        function applyGyroFrame() {
          gyroRaf = null;
          card.style.transition = 'transform .08s linear';
          card.style.transform = `rotateX(${gRX}deg) rotateY(${gRY}deg) scale(1)`;
          shine.style.opacity = '0.55';
          shine.style.background = `radial-gradient(circle at ${(gNx * .5 + .5) * 100}% ${(gNy * .5 + .5) * 100}%, var(--card-shine), transparent 55%)`;
        }

        function startGyro() { window.addEventListener('deviceorientation', applyGyro); }

        if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
          startGyro();
        } else {
          const splashBtn = document.getElementById('audio-splash');
          if (splashBtn) {
            splashBtn.addEventListener('click', function () {
              DeviceOrientationEvent.requestPermission()
                .then(state => { if (state === 'granted') startGyro(); })
                .catch(() => { });
            }, { once: true });
          }
        }
      }
    }

    /* ─────────────── WAVE ─────────────── */
    function initWave() {
      const cv = document.getElementById('waveCanvas');
      const ctx = cv.getContext('2d');

      function resize() {
        const wrap = cv.parentElement;
        cv.width = wrap.clientWidth;
        cv.height = wrap.clientHeight;
      }
      resize(); addEventListener('resize', resize);

      const BAR_COUNT = 48;
      const targets = new Float32Array(BAR_COUNT).fill(0);
      const current = new Float32Array(BAR_COUNT).fill(0);

      /* cache computed style — reading it every frame is expensive */
      let waveTop = '#ffffff', waveBot = 'rgba(255,255,255,1)';
      function refreshWaveColors() {
        const s = getComputedStyle(document.documentElement);
        waveTop = s.getPropertyValue('--wave-top').trim() || '#ffffff';
        waveBot = s.getPropertyValue('--wave-bot').trim() || 'rgba(255,255,255,1)';
      }
      refreshWaveColors();
      setInterval(refreshWaveColors, 2000);

      let frameCount = 0;

      function draw() {
        requestAnimationFrame(draw);
        const W = cv.width, H = cv.height;
        ctx.clearRect(0, 0, W, H);

        frameCount++;
        const t = Date.now();

        for (let i = 0; i < BAR_COUNT; i++) {
          if (_analyser && _wavePlaying && _dataArr) {
            _analyser.getByteFrequencyData(_dataArr);
            const chunk = Math.floor(_dataArr.length / BAR_COUNT);
            let sum = 0; for (let j = 0; j < chunk; j++) sum += _dataArr[i * chunk + j];
            targets[i] = (sum / chunk / 255);
          } else if (_wavePlaying) {
            targets[i] = Math.max(.05, Math.abs(.15 + Math.random() * .7 * Math.sin(t * .002 + i * .4) * Math.sin(t * .003 + i * .2) * .5 + .5));
          } else {
            targets[i] = .04 + Math.sin(t * .0008 + i * .3) * .025;
          }
          current[i] += (targets[i] - current[i]) * (_wavePlaying ? .25 : .08);
        }

        const gap = 3;
        const barW = (W - gap * (BAR_COUNT - 1)) / BAR_COUNT;

        for (let i = 0; i < BAR_COUNT; i++) {
          const h = Math.max(3, current[i] * H * .88);
          const x = i * (barW + gap);
          const y = (H - h) / 2;
          const alpha = .4 + current[i] * .6;

          const grad = ctx.createLinearGradient(0, y, 0, y + h);
          grad.addColorStop(0, hexToRgba(waveTop, alpha));
          grad.addColorStop(1, hexToRgba(waveBot, alpha * .5));

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(x, y, barW, h, 2);
          ctx.fill();
        }
      }
      draw();
    }

    function hexToRgba(hex, a) {
      hex = hex.trim();
      if (hex.startsWith('#')) {
        const n = parseInt(hex.slice(1), 16);
        const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        return `rgba(${r},${g},${b},${a})`;
      }
      if (hex.startsWith('rgba')) { return hex.replace(/[\d.]+\s*\)$/, `${a})`); }
      if (hex.startsWith('rgb(')) { return hex.replace('rgb(', 'rgba(').replace(')', `,${a})`); }
      return hex;
    }

    /* ─────────────── LANYARD ─────────────── */
    function startLanyard(id, gfId) {
      let hb = null, wsOk = false;
      const ids = gfId ? [id, gfId] : [id];

      function routePresence(uid, d) {
        if (String(uid) === String(id)) applyPresence(d);
        else if (gfId && String(uid) === String(gfId)) applyPresenceGF(d);
      }

      function fetchREST(uid) {
        fetch('https://api.lanyard.rest/v1/users/' + uid)
          .then(r => r.ok ? r.json() : null)
          .then(j => { if (j && j.data) routePresence(uid, j.data); })
          .catch(() => { });
      }
      ids.forEach(fetchREST);

      function connect() {
        const ws = new WebSocket('wss://api.lanyard.rest/socket');
        ws.onopen = () => { wsOk = true; };
        ws.onmessage = ev => {
          const { op, d, t } = JSON.parse(ev.data);
          if (op === 1) {
            hb = setInterval(() => ws.send(JSON.stringify({ op: 3 })), d.heartbeat_interval);
            if (gfId) ws.send(JSON.stringify({ op: 2, d: { subscribe_to_ids: ids } }));
            else ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: id } }));
          }
          if (op === 0 && t === 'INIT_STATE') {
            if (gfId && d && typeof d === 'object' && !d.discord_user) {
              Object.keys(d).forEach(uid => routePresence(uid, d[uid]));
            } else {
              routePresence(id, d);
            }
          }
          if (op === 0 && t === 'PRESENCE_UPDATE') routePresence(d.discord_user.id, d);
        };
        ws.onclose = () => { clearInterval(hb); wsOk = false; setTimeout(connect, 3000); };
        ws.onerror = () => ws.close();
      }
      connect();
      setInterval(() => { if (!wsOk) ids.forEach(fetchREST); }, 30000);
    }

        function parseImageStr(imgStr, id) {
          if (!imgStr) return null;
          if (imgStr.startsWith('http')) return imgStr;
          if (imgStr.startsWith('mp:external/')) return 'https://media.discordapp.net/' + imgStr.replace('mp:', '');
          if (imgStr.startsWith('external/')) return 'https://media.discordapp.net/' + imgStr;
          if (id) return `https://cdn.discordapp.com/app-assets/${id}/${imgStr}.png`;
          return imgStr;

        if (rich.timestamps?.start) {

    const BADGE_MAP = [
      [1 << 0, '👾'], [1 << 3, '🎉'], [1 << 6, '🐛'], [1 << 9, '💎'], [1 << 14, '🏆'], [1 << 17, '🎨'],
    ];

    /* ─────────────── PLAYER ─────────────── */
    function initPlayer(tracks) {
      const audio = document.getElementById('audio');
      const btnPlay = document.getElementById('btn-play');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const btnShuf = document.getElementById('btn-shuf');
      const progTr = document.getElementById('prog-track');
      const fill = document.getElementById('prog-fill');
      const volEl = document.getElementById('vol');
      const artWrap = document.getElementById('art-wrap');
      const artImg = document.getElementById('art-img');

      if (!tracks.length) return;

      let idx = 0, playing = false, shuffled = false, actx = null;
      const shuffleQueue = [];
      function buildQueue() { shuffleQueue.length = 0; const a = [...Array(tracks.length).keys()].filter(i => i !== idx).sort(() => Math.random() - .5); shuffleQueue.push(...a, idx); }
      function nextTrack() { if (shuffled) { shuffleQueue.shift(); if (!shuffleQueue.length) buildQueue(); return shuffleQueue[0]; } return (idx + 1) % tracks.length; }
      function prevTrack() { if (shuffled) { return shuffleQueue[shuffleQueue.length - 1] ?? idx; } return (idx - 1 + tracks.length) % tracks.length; }

      audio.preload = 'auto';

      function initAudioContext() {
        if (actx) return;
        actx = new (window.AudioContext || window.webkitAudioContext)();
        _analyser = actx.createAnalyser();
        _analyser.fftSize = 2048;
        _analyser.smoothingTimeConstant = 0.8;
        _dataArr = new Uint8Array(_analyser.frequencyBinCount);
        const mediaSrc = actx.createMediaElementSource(audio);
        mediaSrc.connect(_analyser); _analyser.connect(actx.destination);
      }

      function updateArt(t) {
        if (t.art) {
          artImg.src = t.art; artWrap.style.display = 'block';
          artImg.style.animation = 'none';
          requestAnimationFrame(() => { artImg.style.animation = ''; });
        } else {
          artWrap.style.display = 'none';
        }
      }

      function load(i, andPlay) {
        idx = i;
        const t = tracks[i];
        audio.src = t.src;
        document.getElementById('s-title').textContent = t.title;
        document.getElementById('s-artist').textContent = t.artist || '';
        fill.style.width = '0%';
        document.getElementById('s-time').textContent = '0:00 / 0:00';
        updateArt(t);
        if (t.startAt > 0) {
          audio.addEventListener('loadedmetadata', () => { audio.currentTime = t.startAt; }, { once: true });
        }
        if (andPlay) {
          initAudioContext();
          actx.resume().then(() => { audio.play().then(() => setPlay(true)).catch(() => setPlay(false)); });
        }
      }

      function setPlay(v) {
        playing = v; _wavePlaying = v;
        document.getElementById('play-icon').innerHTML = v
          ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
          : '<polygon points="5 3 19 12 5 21 5 3"/>';
        if (v && actx && actx.state === 'suspended') actx.resume();
      }

      btnShuf.addEventListener('click', () => { shuffled = !shuffled; btnShuf.classList.toggle('active', shuffled); if (shuffled) buildQueue(); });
      btnPlay.addEventListener('click', () => {
        if (!audio.src || audio.src === location.href) return;
        if (playing) {
          audio.pause(); setPlay(false);
        } else {
          initAudioContext();
          actx.resume().then(() => {
            audio.play()
              .then(() => setPlay(true))
              .catch(err => { console.error('Playback failed:', err); setPlay(false); document.getElementById('s-artist').textContent = '⚠ Playback failed — check file path/format'; });
          });
        }
      });

      btnPrev.addEventListener('click', () => { load(prevTrack(), playing); });
      btnNext.addEventListener('click', () => { load(nextTrack(), playing); });

      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        fill.style.width = audio.currentTime / audio.duration * 100 + '%';
        document.getElementById('s-time').textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
      });
      audio.addEventListener('ended', () => { load(nextTrack(), true); });
      audio.addEventListener('error', () => {
        const codes = ['', 'ABORTED', 'NETWORK_ERROR', 'DECODE_ERROR', 'SRC_NOT_SUPPORTED'];
        document.getElementById('s-artist').textContent = `⚠ ${codes[audio.error?.code] || 'UNKNOWN'} — check file path & format`;
        setPlay(false);
      });

      function scrubProgress(e) {
        if (!audio.duration) return;
        const rect = progTr.getBoundingClientRect();
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        audio.currentTime = Math.max(0, Math.min(1, (x - rect.left) / rect.width)) * audio.duration;
      }
      progTr.addEventListener('click', scrubProgress);
      progTr.addEventListener('touchmove', e => { e.preventDefault(); scrubProgress(e); }, { passive: false });

      volEl.addEventListener('input', () => {
        audio.volume = +volEl.value;
        const v = +volEl.value;
        volEl.style.setProperty('--vol-pct', (v * 100) + '%');
        const svg = document.getElementById('vol-svg');
        if (v < .01) {
          svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
        } else if (v < .5) {
          svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        } else {
          svg.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
        }
      });

      const toast = document.getElementById('kbd-toast');
      let toastTimer = null;
      function showToast() {
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        let handled = true;
        switch (e.code) {
          case 'Space': btnPlay.click(); break;
          case 'ArrowRight': load(nextTrack(), playing); break;
          case 'ArrowLeft': load(prevTrack(), playing); break;
          case 'ArrowUp':
            volEl.value = Math.min(1, (+volEl.value + 0.05)).toFixed(2);
            volEl.dispatchEvent(new Event('input')); break;
          case 'ArrowDown':
            volEl.value = Math.max(0, (+volEl.value - 0.05)).toFixed(2);
            volEl.dispatchEvent(new Event('input')); break;
          default: handled = false;
        }
        if (handled) { e.preventDefault(); showToast(); }
      });

      audio.volume = +volEl.value;
      volEl.dispatchEvent(new Event('input'));

      const apNudge = document.getElementById('ap-nudge');
      const splash = document.getElementById('audio-splash');

      load(Math.floor(Math.random() * tracks.length), false);

      function dismissSplashAndPlay() {
        splash.classList.add('fade-out');
        splash.addEventListener('transitionend', () => { splash.remove(); }, { once: true });
        initAudioContext();
        if (actx && actx.state === 'suspended') actx.resume();
        let pp = audio.play();
        if (pp !== undefined) pp.then(() => setPlay(true)).catch(() => { apNudge.classList.add('show'); });
      }

      splash.addEventListener('click', dismissSplashAndPlay, { once: true });
      splash.addEventListener('keydown', dismissSplashAndPlay, { once: true });
    }

    function setName(n) { document.getElementById('p-name').textContent = n; }

    function setAvatar(url) {
      let el = document.getElementById('av-el');
      if (el.tagName !== 'IMG') {
        const img = document.createElement('img');
        img.className = 'av'; img.id = 'av-el';
        el.replaceWith(img); el = img;
      }
      el.src = url;
    }

    function fmt(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    }

    (function initCopyBox() {
      const btn = document.getElementById('copy-btn');
      const txt = document.getElementById('copy-text');
      if (!btn || !txt) return;
      btn.addEventListener('click', async () => {
        const value = txt.textContent;
        try {
          await navigator.clipboard.writeText(value);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = value;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        const original = btn.textContent;
        btn.textContent = 'COPIED';
        setTimeout(() => {
          btn.textContent = original;
        }, 1500);
      });
    })();
  </script>


  <script>
    /* ── Anti-copy / Anti-inspect ── */
    (function () {
      // Disable right click
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // Disable common inspect/devtools shortcuts
      document.addEventListener('keydown', function (e) {
        // F12
        if (e.key === 'F12') { e.preventDefault(); return; }
        // Ctrl+Shift+I / Cmd+Option+I
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return; }
        // Ctrl+Shift+J
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return; }
        // Ctrl+Shift+C
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
        // Ctrl+U (view source)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return; }
        // Ctrl+S (save page)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return; }
        // Ctrl+A (select all)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'A' || e.key === 'a')) { e.preventDefault(); return; }
        // Ctrl+C (copy)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
      });

      // Disable text selection
      document.addEventListener('selectstart', function (e) { e.preventDefault(); });

      // Disable drag
      document.addEventListener('dragstart', function (e) { e.preventDefault(); });

      // Detect devtools open via size difference trick
      const threshold = 160;
      function detectDevTools() {
        if (
          window.outerWidth - window.innerWidth > threshold ||
          window.outerHeight - window.innerHeight > threshold
        ) {
          document.body.innerHTML = '';
        }
      }
      setInterval(detectDevTools, 1000);

      // Console warning
      console.log('%c⛔ hands off', 'color:#fff;background:#000;font-size:40px;padding:10px 20px;font-weight:bold;font-family:Inter,sans-serif;');
      console.log('%cmade by ryze|6ix', 'color:rgba(255,255,255,0.4);font-size:13px;');
    })();
  </script>
